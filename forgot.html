<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - TRINERG</title>
  <!-- Font Awesome Icons for User Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Top Dark Bar with Red Logo -->
  <header style="background-color: #212121; height: 60px; display: flex; align-items: center; padding-left: 5%; border-bottom: 2px solid #333;">
    <a href="index.html" style="background-color: #d31118; height: 100%; padding: 0 20px; display: flex; align-items: center; justify-content: center; text-decoration: none;">
      <span style="color: white; font-weight: bold; font-size: 18px; letter-spacing: 1px;">TRINERG</span>
    </a>
  </header>

  <!-- Centered Form Card -->
  <main style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;">
    <div style="background-color: #4a4a4a; width: 100%; max-width: 380px; padding: 40px 35px; border-radius: 18px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); text-align: center; color: white;">
      
      <h2 style="font-size: 26px; font-weight: 400; margin-top: 0; margin-bottom: 35px; letter-spacing: 0.5px;">Forgot Password</h2>
      
      <form action="#" method="POST">
        <!-- Input Group -->
        <div style="display: flex; align-items: center; border-bottom: 1px solid #888; padding-bottom: 8px; margin-bottom: 35px;">
          <i class="fa-solid fa-user" style="color: #ccc; font-size: 16px; margin-right: 12px;"></i>
          <input type="text" name="username" placeholder="Username" required style="background: transparent; border: none; outline: none; color: white; font-size: 15px; width: 100%;">
        </div>

        <!-- Submit Button -->
        <button type="submit" style="width: 100%; background: transparent; border: 1px solid #bbb; color: white; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s;">Next</button>
      </form>

      <!-- Cancel Link -->
      <a href="login1.html" style="display: inline-block; margin-top: 20px; color: #ccc; text-decoration: none; font-size: 14px; transition: 0.2s;">Cancel</a>
      
    </div>
  </main>

</body>
</html>
